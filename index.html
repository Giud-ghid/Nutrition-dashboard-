<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diario Nutrizionale</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f3f0;font-family:'Courier New',Courier,monospace;color:#1a1916;min-height:100vh;font-size:13px}
header{background:#1a1916;color:#f4f3f0;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header h1{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.meta{font-size:11px;color:#888780;display:flex;align-items:center;gap:12px}
.dot{width:7px;height:7px;border-radius:50%;background:#1d9e75;display:inline-block;flex-shrink:0}
.dot.off{background:#ba7517}
.rbtn{padding:4px 12px;border:1px solid #444441;background:transparent;border-radius:4px;font-size:11px;cursor:pointer;color:#888780;font-family:inherit}
.rbtn:hover{border-color:#888780;color:#f4f3f0}
main{max-width:720px;margin:0 auto;padding:20px 16px}

/* setup */
#setup{background:#fff;border:1px solid #d3d1c7;border-radius:8px;padding:28px 20px;text-align:center;margin-bottom:20px}
#setup h2{font-size:14px;font-weight:700;margin-bottom:8px;letter-spacing:.05em}
#setup p{color:#6b6a65;font-size:12px;margin-bottom:20px;line-height:1.6}
.irow{display:flex;gap:8px;max-width:500px;margin:0 auto}
#apiurl{flex:1;padding:8px 12px;border:1px solid #d3d1c7;border-radius:4px;font-size:12px;font-family:inherit;background:#f4f3f0;color:#1a1916}
.cbtn{padding:8px 16px;background:#1a1916;color:#f4f3f0;border:none;border-radius:4px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.05em;white-space:nowrap}
.cbtn:hover{background:#444441}

/* loading/error */
#loading{display:none;text-align:center;padding:40px;color:#6b6a65;font-size:12px}
.spin{width:22px;height:22px;border:2px solid #d3d1c7;border-top-color:#1d9e75;border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
#errmsg{display:none;background:#fcebeb;border:1px solid #f09595;border-radius:6px;padding:12px 16px;margin-bottom:16px;color:#791f1f;font-size:12px;line-height:1.6}

/* dashboard */
#dash{display:none}

/* sezione */
.sec{background:#fff;border:1px solid #d3d1c7;border-radius:8px;padding:0;margin-bottom:14px;overflow:hidden}
.sec-hdr{background:#f4f3f0;border-bottom:1px solid #d3d1c7;padding:10px 16px;display:flex;align-items:baseline;justify-content:space-between}
.sec-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#1a1916}
.sec-sub{font-size:10px;color:#888780}
.sec-body{padding:16px}

/* tabella nutrienti */
.ntbl{width:100%;border-collapse:collapse}
.ntbl-hdr{display:grid;grid-template-columns:110px 1fr 60px 60px 50px;gap:0;padding:0 0 8px 0;border-bottom:1px solid #d3d1c7;margin-bottom:8px}
.ntbl-hdr span{font-size:10px;color:#888780;letter-spacing:.06em;text-transform:uppercase}
.ntbl-hdr span:not(:first-child){text-align:right}
.nrow{display:grid;grid-template-columns:110px 1fr 60px 60px 50px;gap:0;align-items:center;padding:5px 0;border-bottom:1px solid #f4f3f0}
.nrow:last-child{border-bottom:none}
.nrow.group-sep{border-top:1px solid #d3d1c7;margin-top:4px;padding-top:8px}
.nlabel{font-size:12px;color:#444441}
.nbar-wrap{height:4px;background:#f4f3f0;border-radius:2px;overflow:hidden;margin:0 8px}
.nbar{height:100%;border-radius:2px;transition:width .4s}
.nval{font-size:12px;font-weight:700;text-align:right}
.npct{font-size:11px;text-align:right;color:#888780}
.ntrend{font-size:13px;text-align:right;font-weight:700}

/* colori stato */
.c-ok{color:#0f6e56}.c-hi{color:#854f0b}.c-lo{color:#791f1f}.c-mid{color:#ba7517}
.b-ok{background:#1d9e75}.b-hi{background:#ba7517}.b-lo{background:#a32d2d}.b-mid{background:#ef9f27}

/* ultimo giorno: card grid */
.last-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.lcard{background:#f4f3f0;border-radius:6px;padding:12px 10px}
.lcard .lk{font-size:10px;color:#888780;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.lcard .lv{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1}
.lcard .lu{font-size:10px;color:#888780;margin-top:2px}
.lcard .lpct{font-size:11px;margin-top:4px;font-weight:700}
.lbar{height:3px;background:#e0ddd8;border-radius:2px;margin-top:6px;overflow:hidden}
.lfill{height:100%;border-radius:2px}

/* grafico */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:4px 12px;border:1px solid #d3d1c7;border-radius:20px;font-size:11px;cursor:pointer;color:#888780;background:transparent;font-family:inherit;letter-spacing:.03em}
.tab.on{background:#1a1916;color:#f4f3f0;border-color:#1a1916}
.cwrap{position:relative;width:100%;height:200px}

/* footer */
footer{text-align:center;font-size:11px;color:#888780;padding:20px;letter-spacing:.03em}

/* mobile */
@media(max-width:520px){
  .ntbl-hdr,.nrow{grid-template-columns:90px 1fr 50px 50px 40px}
  .last-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header>
  <h1>Diario Nutrizionale</h1>
  <div class="meta">
    <span class="dot off" id="sdot"></span>
    <span id="stxt">non connesso</span>
    <button class="rbtn" id="rbtn" style="display:none" onclick="loadData()">↻ aggiorna</button>
  </div>
</header>
<main>
  <div id="setup">
    <h2>CONNETTI AL TUO GOOGLE SHEET</h2>
    <p>Incolla l'URL del tuo Apps Script (Web App URL)</p>
    <div class="irow">
      <input id="apiurl" type="url" placeholder="https://script.google.com/macros/s/...">
      <button class="cbtn" onclick="connect()">CONNETTI</button>
    </div>
  </div>
  <div id="loading"><div class="spin"></div>Caricamento dati…</div>
  <div id="errmsg"></div>
  <div id="dash">

    <!-- SEZIONE 1: ultimo giorno -->
    <div class="sec">
      <div class="sec-hdr">
        <span class="sec-title">Ultimo giorno registrato</span>
        <span class="sec-sub" id="last-date"></span>
      </div>
      <div class="sec-body">
        <div class="last-grid" id="last-macro"></div>
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid #f4f3f0">
          <div style="font-size:10px;color:#888780;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Micronutrienti</div>
          <div id="last-micro"></div>
        </div>
      </div>
    </div>

    <!-- SEZIONE 2: confronto 7gg vs storico -->
    <div class="sec">
      <div class="sec-hdr">
        <span class="sec-title">Media 7 giorni vs storico</span>
        <span class="sec-sub" id="ndays-sub"></span>
      </div>
      <div class="sec-body">
        <div class="ntbl-hdr">
          <span>Nutriente</span>
          <span style="text-align:left;padding-left:8px">Barra</span>
          <span>7 gg</span>
          <span>Storico</span>
          <span>Trend</span>
        </div>
        <div id="comp-rows"></div>
      </div>
    </div>

    <!-- SEZIONE 3: storico -->
    <div class="sec">
      <div class="sec-hdr">
        <span class="sec-title">Andamento storico</span>
        <span class="sec-sub">% vs target</span>
      </div>
      <div class="sec-body">
        <div class="tabs" id="chart-tabs"></div>
        <div class="cwrap"><canvas id="tc" role="img" aria-label="Andamento storico nutriente in % vs target"></canvas></div>
      </div>
    </div>

  </div>
</main>
<footer id="foot"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let chart=null, cache=null, chartMetric='kcal';

const MACRO = ['kcal','prot','carb','fat','fiber'];
const MICRO = ['calcium','vitD','vitK2','magnesium','iron','vitC','selenium','omega3'];
const GROUP_SEP = ['calcium','iron'];

function gurl(){try{return localStorage.getItem('napi2')||''}catch(e){return''}}
function surl(u){try{localStorage.setItem('napi2',u)}catch(e){}}
function $(i){return document.getElementById(i)}
function show(i){$(i).style.display='block'}
function hide(i){$(i).style.display='none'}
function fmt(v,d){return d===undefined?Math.round(v*10)/10:v.toFixed(d)}

function pctColor(p){
  if(p===null)return{c:'',b:''};
  if(p<60)return{c:'c-lo',b:'b-lo'};
  if(p<90)return{c:'c-mid',b:'b-mid'};
  if(p<=110)return{c:'c-ok',b:'b-ok'};
  return{c:'c-hi',b:'b-hi'};
}

window.addEventListener('load',()=>{
  const s=gurl();
  if(s){$('apiurl').value=s;connect();}
});

function connect(){
  const u=$('apiurl').value.trim();
  if(!u){showErr('Inserisci l\'URL.');return;}
  surl(u);loadData();
}

async function loadData(){
  const u=gurl();if(!u)return;
  hide('setup');hide('dash');hide('errmsg');show('loading');
  try{
    const r=await fetch(u);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(d.error)throw new Error(d.error);
    cache=d;
    render(d);
    setStatus(true,'aggiornato '+fmtT(d.generated));
    $('rbtn').style.display='inline-block';
  }catch(e){
    showErr('Errore: '+e.message+'<br>Verifica URL e autorizzazioni script.');
    setStatus(false,'errore');
    show('setup');
  }finally{hide('loading');}
}

function render(d){
  renderLastDay(d);
  renderComparison(d);
  renderChartTabs(d);
  $('last-date').textContent=fmtDate(d.lastDate);
  $('ndays-sub').textContent=d.nDays+' giorni totali';
  $('foot').textContent='DIARIO NUTRIZIONALE · '+d.nDays+' giorni · ultimo: '+d.lastDate;
  show('dash');
  setTimeout(()=>renderChart(d,chartMetric),100);
}

function renderLastDay(d){
  const ld=d.lastDay, tgt=d.targets;

  // macro cards
  $('last-macro').innerHTML=MACRO.map(k=>{
    const v=ld[k]||0, t=tgt[k], u=d.units[k];
    const pct=t?Math.round(v/t*100):null;
    const {c,b}=pctColor(pct);
    return`<div class="lcard">
      <div class="lk">${d.labels[k]}</div>
      <div class="lv ${c}">${fmt(v)}</div>
      <div class="lu">${u}${t?' / '+t:''}</div>
      ${pct!==null?`<div class="lpct ${c}">${pct}%</div><div class="lbar"><div class="lfill ${b}" style="width:${Math.min(pct,100)}%"></div></div>`:''}
    </div>`;
  }).join('');

  // micro rows
  $('last-micro').innerHTML=MICRO.map((k,i)=>{
    const v=ld[k]||0, t=tgt[k], u=d.units[k];
    const pct=t?Math.round(v/t*100):null;
    const {c,b}=pctColor(pct);
    const isOmega=k==='omega3';
    const label=d.labels[k]+(isOmega?' (mm4)':'');
    return`<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #f4f3f0${k==='calcium'&&i>0?';border-top:1px solid #d3d1c7;margin-top:4px;padding-top:8px':''}">
      <span style="width:100px;font-size:11px;color:#444441">${label}</span>
      <div style="flex:1;height:3px;background:#f4f3f0;border-radius:2px;overflow:hidden"><div class="lfill ${b}" style="width:${pct!==null?Math.min(pct,100):0}%"></div></div>
      <span style="width:60px;text-align:right;font-size:11px;font-weight:700" class="${c}">${fmt(v)} ${u}</span>
      ${pct!==null?`<span style="width:36px;text-align:right;font-size:11px;color:#888780">${pct}%</span>`:''}
    </div>`;
  }).join('');
}

function renderComparison(d){
  const order=d.nutrientOrder||Object.keys(d.comparison);
  $('comp-rows').innerHTML=order.map((k,i)=>{
    const c=d.comparison[k];
    if(!c)return'';
    const {c:c7,b:b7}=pctColor(c.pct7);
    const {c:ca}=pctColor(c.pctAll);
    const trend=c.trend==='up'?'↑':c.trend==='down'?'↓':'—';
    const tc=c.trend==='up'?'c-ok':c.trend==='down'?'c-lo':'';
    const sep=GROUP_SEP.includes(k)?'group-sep':'';
    const note=c.isOmega3mm4?' <span style="font-size:9px;color:#888780">(mm4)</span>':'';
    return`<div class="nrow ${sep}">
      <span class="nlabel">${c.label}${note}</span>
      <div class="nbar-wrap"><div class="nbar ${b7}" style="width:${c.pct7!==null?Math.min(c.pct7,100):0}%"></div></div>
      <span class="nval ${c7}">${c.pct7!==null?c.pct7+'%':'—'}</span>
      <span class="npct ${ca}">${c.pctAll!==null?c.pctAll+'%':'—'}</span>
      <span class="ntrend ${tc}">${trend}</span>
    </div>`;
  }).join('');
}

function renderChartTabs(d){
  const order=d.nutrientOrder||[];
  $('chart-tabs').innerHTML=order.map(k=>{
    const lbl=d.labels[k]||(d.comparison[k]&&d.comparison[k].label)||k;
    return`<button class="tab${k===chartMetric?' on':''}" onclick="renderChart(cache,'${k}')">${lbl}</button>`;
  }).join('');
}

function renderChart(d,m){
  chartMetric=m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.textContent.trim()===(d.labels[m]||(d.comparison[m]&&d.comparison[m].label)||m)));
  const tgt=d.targets[m];
  const daily=d.daily.slice(-60);
  const labels=daily.map(r=>r.date.slice(5));
  const vals=daily.map(r=>tgt&&r[m]!=null?Math.round(r[m]/tgt*100):null);
  if(chart){chart.destroy();chart=null;}
  const ctx=$('tc').getContext('2d');
  chart=new Chart(ctx,{
    type:'line',
    data:{labels,datasets:[
      {label:'% target',data:vals,borderColor:'#1d9e75',backgroundColor:'rgba(29,158,117,0.07)',fill:true,tension:.3,pointRadius:2,borderWidth:1.5,spanGaps:true},
      {label:'100%',data:daily.map(()=>100),borderColor:'rgba(186,117,23,0.4)',borderDash:[4,4],borderWidth:1,pointRadius:0,fill:false}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>(ctx.datasetIndex===0?ctx.parsed.y+'% vs target':'target 100%')}}},
      scales:{
        x:{grid:{display:false},ticks:{maxTicksLimit:8,font:{size:10},color:'#888780',fontFamily:'Courier New'}},
        y:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{font:{size:10},color:'#888780',callback:v=>v+'%'},min:0}
      }
    }
  });
}

function fmtDate(s){
  if(!s)return'';
  try{
    const [y,m,dd]=s.split('-');
    const months=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
    return dd+' '+months[parseInt(m)-1]+' '+y;
  }catch(e){return s;}
}
function fmtT(iso){try{return new Date(iso).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}catch(e){return''}}
function showErr(m){$('errmsg').innerHTML=m;show('errmsg');}
function setStatus(ok,msg){$('sdot').className='dot'+(ok?'':' off');$('stxt').textContent=msg;}
</script>
</body>
</html>
