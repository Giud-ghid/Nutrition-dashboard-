<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diario Nutrizionale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f5;font-family:'JetBrains Mono',monospace;color:#2d2d2d;min-height:100vh;font-size:13px}

header{background:#2d2d2d;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header h1{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.meta{font-size:11px;color:#999;display:flex;align-items:center;gap:10px}
.dot{width:7px;height:7px;border-radius:50%;background:#3aab7b;display:inline-block;flex-shrink:0}
.dot.off{background:#e09a3a}
.rbtn{padding:4px 12px;border:1px solid rgba(255,255,255,0.3);background:transparent;border-radius:4px;font-size:11px;cursor:pointer;color:#fff;font-family:inherit}
.rbtn:hover{border-color:rgba(255,255,255,0.7)}

main{max-width:720px;margin:0 auto;padding:20px 16px}

#setup{background:#fff;border:0.5px solid #e0e0e0;border-radius:8px;padding:28px 20px;text-align:center;margin-bottom:20px}
#setup h2{font-size:13px;font-weight:700;margin-bottom:8px;letter-spacing:.08em;text-transform:uppercase}
#setup p{color:#999;font-size:12px;margin-bottom:20px;line-height:1.6}
.irow{display:flex;gap:8px;max-width:500px;margin:0 auto}
#apiurl{flex:1;padding:8px 12px;border:0.5px solid #e0e0e0;border-radius:4px;font-size:12px;font-family:inherit;background:#f5f5f5;color:#2d2d2d}
.cbtn{padding:8px 16px;background:#2d2d2d;color:#fff;border:none;border-radius:4px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.06em;white-space:nowrap}

#loading{display:none;text-align:center;padding:40px;color:#999;font-size:12px}
.spin{width:22px;height:22px;border:2px solid #e0e0e0;border-top-color:#3aab7b;border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
#errmsg{display:none;background:#fdf0f0;border:0.5px solid #e05c5c;border-radius:6px;padding:12px 16px;margin-bottom:16px;color:#c0392b;font-size:12px;line-height:1.6}

#dash{display:none}

.sec{background:#fff;border:0.5px solid #e0e0e0;border-radius:8px;margin-bottom:14px;overflow:hidden}
.sec-hdr{background:#f5f5f5;border-bottom:1px solid #e0e0e0;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.sec-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#2d2d2d}
.date-box{background:#2d2d2d;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:4px;letter-spacing:.05em;text-transform:uppercase}
.sec-sub{font-size:10px;color:#999}
.sec-body{padding:16px}

/* colori zona */
.c-lo{color:#e05c5c}.c-mid{color:#e09a3a}.c-ok{color:#3aab7b}.c-hi{color:#e09a3a}
.b-lo{background:#e05c5c}.b-mid{background:#e09a3a}.b-ok{background:#3aab7b}.b-hi{background:#e09a3a}

/* macro boxes */
.macro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
@media(min-width:480px){.macro-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:600px){.macro-grid{grid-template-columns:repeat(5,1fr)}}
.mbox{background:#fff;border:0.5px solid #e0e0e0;border-radius:8px;padding:12px}
.mbox-label{font-size:9px;color:#999;letter-spacing:.05em;margin-bottom:6px}
.mbox-val{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1}
.mbox-bar{height:3px;background:#f0f0f0;border-radius:2px;margin-top:10px}
.mbox-fill{height:100%;border-radius:2px}
.mbox-pct{font-size:10px;font-weight:700;margin-top:4px}

/* micro table */
.micro-hdr{display:grid;grid-template-columns:90px 1fr 40px 80px;padding:0 0 8px;border-bottom:1px solid #f0f0f0;margin-bottom:4px}
.micro-hdr span{font-size:9px;color:#bbb;text-transform:uppercase;letter-spacing:.06em}
.micro-hdr span:nth-child(3),.micro-hdr span:nth-child(4){text-align:right}
.micro-row{display:grid;grid-template-columns:90px 1fr 40px 80px;align-items:center;padding:5px 0;border-bottom:1px solid #f9f9f9}
.micro-row:last-child{border-bottom:none}
.micro-sep{border-top:1px solid #e0e0e0;margin-top:4px;padding-top:8px}
.micro-bar-wrap{height:3px;background:#f0f0f0;border-radius:2px;margin:0 8px;overflow:hidden}
.micro-bar{height:100%;border-radius:2px}
.micro-pct{font-size:11px;font-weight:700;text-align:right}
.micro-val{font-size:11px;color:#666;text-align:right}

/* calendario */
.cal-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cal-tbl{border-collapse:collapse;min-width:520px;width:100%}
.cal-tbl th{font-size:9px;color:#2d2d2d;font-weight:700;padding:8px 4px;text-align:center;border-bottom:1px solid #f0f0f0;white-space:nowrap}
.cal-tbl th.nc{text-align:left;color:#bbb;font-weight:400;letter-spacing:.06em;text-transform:uppercase;min-width:85px;padding-left:0}
.cal-tbl td{padding:3px 3px;text-align:center;border-bottom:1px solid #f9f9f9}
.cal-tbl td.nc{font-size:11px;color:#444;text-align:left;padding:5px 8px 5px 0;white-space:nowrap}
.cal-tbl tr.gsep td{border-top:1px solid #e0e0e0}
.chip{color:#fff;font-size:10px;font-weight:700;padding:3px 4px;border-radius:3px;display:inline-block;min-width:34px;text-align:center}
.cal-hint{padding:8px 0 2px;font-size:9px;color:#bbb}

/* confronto 7gg */
.cmp-hdr{display:grid;grid-template-columns:90px 1fr 48px 56px 32px;padding:0 0 8px;border-bottom:1px solid #f0f0f0;margin-bottom:4px}
.cmp-hdr span{font-size:9px;color:#bbb;text-transform:uppercase;letter-spacing:.06em}
.cmp-hdr span:nth-child(3),.cmp-hdr span:nth-child(4),.cmp-hdr span:nth-child(5){text-align:right}
.cmp-row{display:grid;grid-template-columns:90px 1fr 48px 56px 32px;align-items:center;padding:5px 0;border-bottom:1px solid #f9f9f9}
.cmp-row:last-child{border-bottom:none}
.cmp-sep{border-top:1px solid #e0e0e0;margin-top:4px;padding-top:8px}
.cmp-bar-wrap{height:3px;background:#f0f0f0;border-radius:2px;margin:0 8px;overflow:hidden}
.cmp-bar{height:100%;border-radius:2px}
.trend-box{display:inline-block;color:#fff;font-size:11px;font-weight:700;padding:2px 5px;border-radius:3px}

footer{text-align:center;font-size:10px;color:#bbb;padding:20px;letter-spacing:.04em}
</style>
</head>
<body>
<header>
  <h1>Diario Nutrizionale</h1>
  <div class="meta">
    <span class="dot off" id="sdot"></span>
    <span id="stxt">non connesso</span>
    <button class="rbtn" id="rbtn" style="display:none" onclick="loadData()">↻ aggiorna</button>
  </div>
</header>
<main>
  <div id="setup">
    <h2>Connetti al tuo Google Sheet</h2>
    <p>Incolla l'URL del tuo Apps Script (Web App URL)</p>
    <div class="irow">
      <input id="apiurl" type="url" placeholder="https://script.google.com/macros/s/...">
      <button class="cbtn" onclick="connect()">Connetti</button>
    </div>
  </div>
  <div id="loading"><div class="spin"></div>Caricamento dati…</div>
  <div id="errmsg"></div>
  <div id="dash">

    <div class="sec">
      <div class="sec-hdr">
        <span class="sec-title">Ultimo giorno registrato</span>
        <span class="date-box" id="last-date">—</span>
      </div>
      <div class="sec-body">
        <div class="macro-grid" id="macro-grid"></div>
        <div class="micro-hdr">
          <span>nutriente</span><span></span><span>%</span><span>valore</span>
        </div>
        <div id="micro-rows"></div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-hdr">
        <span class="sec-title">Ultimi 7 giorni</span>
        <span class="sec-sub">% vs target</span>
      </div>
      <div class="sec-body" style="padding:12px 16px">
        <div class="cal-wrap"><table class="cal-tbl" id="cal-tbl"></table></div>
        <div class="cal-hint">← scorri per vedere tutti i giorni</div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-hdr">
        <span class="sec-title">Media 7 giorni vs storico</span>
        <span class="sec-sub" id="ndays-sub"></span>
      </div>
      <div class="sec-body">
        <div class="cmp-hdr">
          <span>nutriente</span><span></span>
          <span>7gg/tgt</span><span>st/tgt</span><span>trend</span>
        </div>
        <div id="cmp-rows"></div>
      </div>
    </div>

  </div>
</main>
<footer id="foot"></footer>

<script>
const MACRO     = ['kcal','prot','carb','fat','fiber'];
const MICRO     = ['calcium','vitD','vitK2','magnesium','iron','vitC','selenium','omega3'];
const MICRO_SEP = ['iron'];
const ALL       = [...MACRO,...MICRO];
let cache = null;

function gurl(){try{return localStorage.getItem('napi4')||''}catch(e){return''}}
function surl(u){try{localStorage.setItem('napi4',u)}catch(e){}}
function $(i){return document.getElementById(i)}
function show(i){$(i).style.display='block'}
function hide(i){$(i).style.display='none'}
function fmt(v){return Math.round(v*10)/10}

// zona → classi CSS
function zoneClass(zone){
  if(!zone)return{c:'',b:''};
  if(zone==='lo')   return{c:'c-lo',b:'b-lo'};
  if(zone==='mid_lo'||zone==='mid_hi') return{c:'c-mid',b:'b-mid'};
  if(zone==='ok')   return{c:'c-ok',b:'b-ok'};
  if(zone==='hi')   return{c:'c-hi',b:'b-hi'};
  return{c:'',b:''};
}

// calcola zona lato client (per lastDay dove non arriva zone dal server)
function calcZone(pct, tgt){
  if(pct===null||!tgt)return null;
  const {type,low,optLow,optHigh,high}=tgt;
  if(pct<low)         return'lo';
  if(pct<optLow)      return'mid_lo';
  if(pct<=optHigh)    return'ok';
  if(type==='minimum')return'ok';
  if(pct<=high)       return'mid_hi';
  return'hi';
}

window.addEventListener('load',()=>{
  const s=gurl();
  if(s){$('apiurl').value=s;connect();}
});

function connect(){
  const u=$('apiurl').value.trim();
  if(!u)return;
  surl(u);loadData();
}

async function loadData(){
  const u=gurl();if(!u)return;
  hide('setup');hide('dash');hide('errmsg');show('loading');
  try{
    const r=await fetch(u);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(d.error)throw new Error(d.error);
    cache=d;render(d);
    setStatus(true,'aggiornato '+fmtT(d.generated));
    $('rbtn').style.display='inline-block';
  }catch(e){
    $('errmsg').innerHTML='Errore: '+e.message;
    show('errmsg');setStatus(false,'errore');show('setup');
  }finally{hide('loading');}
}

function render(d){
  renderLastDay(d);
  renderCalendar(d);
  renderComparison(d);
  $('last-date').textContent=fmtDate(d.lastDate);
  $('ndays-sub').textContent=d.nDays+' giorni totali';
  $('foot').textContent='DIARIO NUTRIZIONALE · '+d.nDays+' giorni · ultimo: '+d.lastDate;
  show('dash');
}

function renderLastDay(d){
  const ld=d.lastDay, tgts=d.targets, lbl=d.labels, unt=d.units;

  $('macro-grid').innerHTML=MACRO.map(k=>{
    const v=ld[k]||0, tgt=tgts[k];
    const pct=tgt?Math.round(v/tgt.value*100):null;
    const zone=calcZone(pct,tgt);
    const {c,b}=zoneClass(zone);
    return`<div class="mbox">
      <div class="mbox-label">${lbl[k]} · ${unt[k]}</div>
      <div class="mbox-val ${c}">${fmt(v)}</div>
      <div class="mbox-bar"><div class="mbox-fill ${b}" style="width:${pct?Math.min(pct,100):0}%"></div></div>
      <div class="mbox-pct ${c}">${pct!==null?pct+'%':'—'}</div>
    </div>`;
  }).join('');

  $('micro-rows').innerHTML=MICRO.map(k=>{
    const v=ld[k]||0, tgt=tgts[k];
    const pct=tgt?Math.round(v/tgt.value*100):null;
    const zone=calcZone(pct,tgt);
    const {c,b}=zoneClass(zone);
    const sep=MICRO_SEP.includes(k)?'micro-sep':'';
    const isOmega=k==='omega3';
    return`<div class="micro-row ${sep}">
      <span style="font-size:11px;color:#444">${lbl[k]}${isOmega?' <span style="font-size:9px;color:#bbb">mm4</span>':''}</span>
      <div class="micro-bar-wrap"><div class="micro-bar ${b}" style="width:${pct?Math.min(pct,100):0}%"></div></div>
      <span class="micro-pct ${c}">${pct!==null?pct+'%':'—'}</span>
      <span class="micro-val">${fmt(v)} ${unt[k]}</span>
    </div>`;
  }).join('');
}

function renderCalendar(d){
  const last7=d.daily.slice(-7);
  const tgts=d.targets, lbl=d.labels;

  let thead=`<thead><tr><th class="nc">nutriente</th>`;
  last7.forEach(day=>{thead+=`<th>${fmtShort(day.date)}</th>`;});
  thead+=`</tr></thead>`;

  let tbody='<tbody>';
  [{keys:MACRO,sep:false},{keys:MICRO,sep:true}].forEach(({keys,sep})=>{
    keys.forEach((k,i)=>{
      const tgt=tgts[k];
      const isOmega=k==='omega3';
      tbody+=`<tr${sep&&i===0?' class="gsep"':''}>`;
      tbody+=`<td class="nc">${lbl[k]}${isOmega?' <span style="font-size:9px;color:#bbb">mm4</span>':''}</td>`;
      last7.forEach(day=>{
        const v=day[k]||0;
        const pct=tgt?Math.round(v/tgt.value*100):null;
        const zone=calcZone(pct,tgt);
        const {b}=zoneClass(zone);
        tbody+=`<td><span class="chip ${b}">${pct!==null?pct+'%':'—'}</span></td>`;
      });
      tbody+='</tr>';
    });
  });
  tbody+='</tbody>';
  $('cal-tbl').innerHTML=thead+tbody;
}

function renderComparison(d){
  const lbl=d.labels;
  $('cmp-rows').innerHTML=ALL.map((k,i)=>{
    const c=d.comparison[k];
    if(!c)return'';
    const {c:c7,b:b7}=zoneClass(c.zone7);
    const {c:ca}=zoneClass(c.zoneAll);
    const isSep=(k==='calcium'||k==='iron');
    const isOmega=k==='omega3';
    let trendHtml='';
    if(c.trend==='up')   trendHtml=`<span class="trend-box b-ok">↑</span>`;
    else if(c.trend==='down') trendHtml=`<span class="trend-box b-lo">↓</span>`;
    else trendHtml=`<span class="trend-box" style="background:#bbb">—</span>`;
    return`<div class="cmp-row${isSep?' cmp-sep':''}">
      <span style="font-size:11px;color:#444">${c.label}${isOmega?' <span style="font-size:9px;color:#bbb">mm4</span>':''}</span>
      <div class="cmp-bar-wrap"><div class="cmp-bar ${b7}" style="width:${c.pct7?Math.min(c.pct7,100):0}%"></div></div>
      <span style="font-size:11px;font-weight:700;text-align:right" class="${c7}">${c.pct7!==null?c.pct7+'%':'—'}</span>
      <span style="font-size:11px;text-align:right" class="${ca}">${c.pctAll!==null?c.pctAll+'%':'—'}</span>
      <div style="display:flex;justify-content:flex-end">${trendHtml}</div>
    </div>`;
  }).join('');
}

function fmtDate(s){
  if(!s)return'';
  try{const[y,m,dd]=s.split('-');const mo=['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];return dd+' '+mo[parseInt(m)-1]+' '+y;}catch(e){return s;}
}
function fmtShort(s){
  if(!s)return'';
  try{const[,m,dd]=s.split('-');const mo=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];return dd+'\n'+mo[parseInt(m)-1];}catch(e){return s;}
}
function fmtT(iso){try{return new Date(iso).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}catch(e){return''}}
function setStatus(ok,msg){$('sdot').className='dot'+(ok?'':' off');$('stxt').textContent=msg;}
</script>
</body>
</html>
