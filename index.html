<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diario Nutrizionale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f5;font-family:'JetBrains Mono',monospace;color:#2d2d2d;min-height:100vh;font-size:13px}

/* HEADER */
header{background:#2d2d2d;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header h1{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.meta{font-size:11px;color:#999;display:flex;align-items:center;gap:10px}
.dot{width:7px;height:7px;border-radius:50%;background:#3aab7b;display:inline-block;flex-shrink:0}
.dot.off{background:#e09a3a}
.rbtn{padding:4px 12px;border:1px solid rgba(255,255,255,0.3);background:transparent;border-radius:4px;font-size:11px;cursor:pointer;color:#fff;font-family:inherit}
.rbtn:hover{border-color:rgba(255,255,255,0.7)}
@media(max-width:479px){header{padding:8px 12px}header h1{font-size:10px;letter-spacing:.08em}.meta{gap:6px}.rbtn{padding:3px 8px;font-size:10px}}

main{max-width:720px;margin:0 auto;padding:20px 16px}

/* SETUP */
#setup{background:#fff;border:0.5px solid #e0e0e0;border-radius:8px;padding:28px 20px;text-align:center;margin-bottom:20px}
#setup h2{font-size:13px;font-weight:700;margin-bottom:8px;letter-spacing:.08em;text-transform:uppercase}
#setup p{color:#999;font-size:12px;margin-bottom:20px;line-height:1.6}
.irow{display:flex;gap:8px;max-width:500px;margin:0 auto}
#apiurl{flex:1;padding:8px 12px;border:0.5px solid #e0e0e0;border-radius:4px;font-size:12px;font-family:inherit;background:#f5f5f5;color:#2d2d2d}
.cbtn{padding:8px 16px;background:#2d2d2d;color:#fff;border:none;border-radius:4px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.06em;white-space:nowrap}

#loading{display:none;text-align:center;padding:40px;color:#999;font-size:12px}
.spin{width:22px;height:22px;border:2px solid #e0e0e0;border-top-color:#3aab7b;border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
#errmsg{display:none;background:#fdf0f0;border:0.5px solid #e05c5c;border-radius:6px;padding:12px 16px;margin-bottom:16px;color:#c0392b;font-size:12px;line-height:1.6}
#dash{display:none}

/* SEZIONE */
.sec{background:#fff;border:0.5px solid #e0e0e0;border-radius:8px;margin-bottom:14px;overflow:hidden}
.sec-hdr{background:#2d2d2d;border-bottom:none;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.sec-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff}
.sec-sub{font-size:10px;color:#888}
.date-box{background:#fff;color:#2d2d2d;font-size:11px;font-weight:700;padding:3px 10px;border-radius:4px;letter-spacing:.05em;text-transform:uppercase}
.sec-body{padding:12px}

/* SOTTO-BLOCCO */
.sub-block{border-left:3px solid #d0d0d0;background:#fafafa;border-radius:0 6px 6px 0;padding:12px 14px;margin-bottom:8px}
.sub-block:last-child{margin-bottom:0}
.sub-title{font-size:9px;color:#999;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}

/* COLORI SEMAFORO */
.c-lo{color:#e05c5c}.c-mid{color:#e09a3a}.c-ok{color:#3aab7b}.c-hi{color:#e09a3a}
.b-lo{background:#e05c5c}.b-mid{background:#e09a3a}.b-ok{background:#3aab7b}.b-hi{background:#e09a3a}

/* CALENDARIO */
.cal-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cal-tbl{border-collapse:collapse;width:100%}
.cal-tbl th{font-size:9px;color:#2d2d2d;font-weight:700;padding:7px 4px;text-align:center;border-bottom:1px solid #f0f0f0;white-space:nowrap;background:#fafafa}
.cal-tbl th.nc{text-align:left;color:#bbb;font-weight:400;letter-spacing:.06em;text-transform:uppercase;min-width:110px;padding-left:0;position:sticky;left:0;background:#fafafa;z-index:2}
.cal-tbl td{padding:3px 3px;text-align:center;border-bottom:1px solid #f9f9f9;background:#fafafa}
.cal-tbl td.nc{font-size:11px;color:#444;text-align:left;padding:5px 4px 5px 0;white-space:nowrap;position:sticky;left:0;background:#fafafa;z-index:1;display:flex;align-items:center;gap:4px}
.cal-tbl tr.gsep td{border-top:1px solid #e0e0e0}
.chip{color:#fff;font-size:10px;font-weight:700;padding:3px 4px;border-radius:3px;display:inline-block;min-width:36px;text-align:center}
.chip-partial{background:#fff !important;font-size:10px;font-weight:700;padding:2px 3px;border-radius:3px;display:inline-block;min-width:36px;text-align:center;border:1.5px solid}
.chip-partial.b-lo{border-color:#e05c5c;color:#e05c5c}
.chip-partial.b-mid{border-color:#e09a3a;color:#e09a3a}
.chip-partial.b-ok{border-color:#3aab7b;color:#3aab7b}
.chip-partial.b-hi{border-color:#e09a3a;color:#e09a3a}
.chip-absent{background:#f0f0f0;color:#999;font-size:10px;font-weight:700;padding:3px 4px;border-radius:3px;display:inline-block;min-width:36px;text-align:center}
.cal-hint{padding:6px 0 2px;font-size:9px;color:#bbb}

/* QUALITÀ LOG */
.quality-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 8px;border-radius:3px;font-weight:700;letter-spacing:.04em}
.q-completo{background:#e8f5ee;color:#0f6e56}
.q-parziale{background:#faeeda;color:#854f0b}
.q-assente{background:#fdf0f0;color:#c0392b}
.q-nd{background:#f0f0f0;color:#999}
.quality-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.qd-completo{background:#3aab7b}
.qd-parziale{background:#e09a3a}
.qd-assente{background:#e05c5c}
.qd-nd{background:#bbb}

/* STATS QUALITÀ */
.quality-stats{display:flex;gap:16px;flex-wrap:wrap;padding:10px 14px;background:#fafafa;border-left:3px solid #d0d0d0;border-radius:0 6px 6px 0;margin-bottom:8px}
.qs-item{display:flex;flex-direction:column;gap:2px}
.qs-label{font-size:9px;color:#999;text-transform:uppercase;letter-spacing:.06em}
.qs-val{font-size:16px;font-weight:700;color:#2d2d2d}
.qs-sub{font-size:10px;color:#999}

/* BADGE OBS */
.obs-badge{background:#7aa3d4;color:#fff;font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle;margin-left:4px}

/* MACRO CARDS — sotto-blocco A */
.macro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:480px){.macro-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:600px){.macro-grid{grid-template-columns:repeat(5,1fr)}}
@media(max-width:479px){.mbox-fiber{grid-column:1/-1}}
.mbox{background:#fff;border:0.5px solid #e0e0e0;border-radius:8px;padding:12px}
.mbox-label{font-size:9px;color:#999;letter-spacing:.04em;margin-bottom:6px}
.mbox-val{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1}
.mbox-bar{height:3px;background:#f0f0f0;border-radius:2px;margin-top:10px}
.mbox-fill{height:100%;border-radius:2px}
.mbox-pct{font-size:10px;font-weight:700;margin-top:4px}

/* TABELLA NUTRIENTI — sotto-blocchi B/C/D */
.nutr-tbl-hdr{display:grid;grid-template-columns:130px 1fr 40px 75px;padding:0 0 6px;border-bottom:1px solid #f0f0f0;margin-bottom:4px}
.nutr-tbl-hdr span{font-size:9px;color:#bbb;text-transform:uppercase;letter-spacing:.06em}
.nutr-tbl-hdr span:nth-child(3),.nutr-tbl-hdr span:nth-child(4){text-align:right}
.nutr-row{display:grid;grid-template-columns:130px 1fr 40px 75px;align-items:center;padding:5px 0;border-bottom:1px solid #f9f9f9}
.nutr-row:last-child{border-bottom:none}
.nutr-name{font-size:11px;color:#444;display:flex;align-items:center;flex-wrap:nowrap;gap:4px;white-space:nowrap;overflow:hidden}
.nutr-bar-wrap{height:3px;background:#f0f0f0;border-radius:2px;margin:0 8px;overflow:hidden}
.nutr-bar{height:100%;border-radius:2px}
.nutr-pct{font-size:11px;font-weight:700;text-align:right}
.nutr-val{font-size:11px;color:#666;text-align:right}

/* NOTE mm4 */
.mm4-tag{font-size:9px;color:#bbb;margin-left:3px}

@media(max-width:479px){
  .nutr-tbl-hdr,.nutr-row{grid-template-columns:105px 1fr 34px 62px}
}

footer{text-align:center;font-size:10px;color:#bbb;padding:20px;letter-spacing:.04em}
</style>
</head>
<body>
<header>
  <h1>Diario Nutrizionale</h1>
  <div class="meta">
    <span class="dot off" id="sdot"></span>
    <span id="stxt">non connesso</span>
    <button class="rbtn" id="rbtn" style="display:none" onclick="loadData()">↻ aggiorna</button>
  </div>
</header>
<main>
  <div id="setup">
    <h2>Connetti al tuo Google Sheet</h2>
    <p>Incolla l'URL del tuo Apps Script (Web App URL)</p>
    <div class="irow">
      <input id="apiurl" type="url" placeholder="https://script.google.com/macros/s/...">
      <button class="cbtn" onclick="connect()">Connetti</button>
    </div>
  </div>
  <div id="loading"><div class="spin"></div>Caricamento dati…</div>
  <div id="errmsg"></div>
  <div id="dash">

    <!-- BLOCCO 1: ULTIMO GIORNO -->
    <div class="sec" id="block1">
      <div class="sec-hdr">
        <span class="sec-title">Ultimo giorno registrato</span>
        <span class="date-box" id="last-date">—</span>
      </div>
      <div class="sec-body" id="block1-body">
        <!-- sotto-blocchi renderizzati da JS -->
      </div>
    </div>

    <!-- BLOCCO 2: ULTIMI 7 GIORNI -->
    <div class="sec" id="block2">
      <div class="sec-hdr">
        <span class="sec-title">Ultimi 7 giorni</span>
        <span class="sec-sub">% vs target</span>
      </div>
      <div class="sec-body" id="block2-body">
        <!-- matrici renderizzate da JS -->
      </div>
    </div>

  </div>
</main>
<footer id="foot"></footer>

<script>
let cache = null;

function gurl(){try{return localStorage.getItem('napi6')||''}catch(e){return''}}
function surl(u){try{localStorage.setItem('napi6',u)}catch(e){}}
function $(i){return document.getElementById(i)}
function show(i){$(i).style.display='block'}
function hide(i){$(i).style.display='none'}
function fmt(v){return Math.round(v*10)/10}

// Zona → classi CSS
function zCls(zone){
  if(!zone)return{c:'',b:''};
  if(zone==='lo')return{c:'c-lo',b:'b-lo'};
  if(zone==='mid_lo'||zone==='mid_hi')return{c:'c-mid',b:'b-mid'};
  if(zone==='ok')return{c:'c-ok',b:'b-ok'};
  if(zone==='hi')return{c:'c-hi',b:'b-hi'};
  if(zone==='monitor')return{c:'c-mid',b:'b-mid'};
  return{c:'',b:''};
}

// Calcola zona lato client
function calcZone(pct, tgt){
  if(pct===null||!tgt)return null;
  if(tgt.type==='monitor')return'monitor';
  const{type,low,optLow,optHigh,high}=tgt;
  if(pct<low)return'lo';
  if(pct<optLow)return'mid_lo';
  if(pct<=optHigh)return'ok';
  if(type==='minimum')return'ok';
  if(pct<=high)return'mid_hi';
  return'hi';
}

// Badge OBS
function obsBadge(phase){
  return phase==='observation'
    ? '<span class="obs-badge">OBS</span>'
    : '';
}

window.addEventListener('load',()=>{
  const s=gurl();
  if(s){$('apiurl').value=s;connect();}
});

function connect(){
  const u=$('apiurl').value.trim();
  if(!u)return;
  surl(u);loadData();
}

async function loadData(){
  const u=gurl();if(!u)return;
  hide('setup');hide('dash');hide('errmsg');show('loading');
  try{
    const r=await fetch(u);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(d.error)throw new Error(d.error);
    cache=d;render(d);
    setStatus(true,'aggiornato '+fmtT(d.generated));
    $('rbtn').style.display='inline-block';
  }catch(e){
    $('errmsg').innerHTML='Errore: '+e.message;
    show('errmsg');setStatus(false,'errore');show('setup');
  }finally{hide('loading');}
}

function render(d){
  $('last-date').textContent=fmtDate(d.lastDate);
  renderQualityBadge(d);
  renderBlock1(d);
  renderBlock2(d);
  $('foot').textContent='DIARIO NUTRIZIONALE · '+d.nDays+' giorni · ultimo: '+d.lastDate;
  show('dash');
}

function renderQualityBadge(d){
  // Badge qualità nell'header blocco 1
  const lastQ = d.daily.length ? d.daily[d.daily.length-1].log_quality : 'non dichiarato';
  const badgeMap = {
    'completo':       {cls:'q-completo', dot:'qd-completo', label:'completo'},
    'parziale':       {cls:'q-parziale', dot:'qd-parziale', label:'parziale'},
    'in corso':       {cls:'q-parziale', dot:'qd-parziale', label:'in corso'},
    'assente':        {cls:'q-assente',  dot:'qd-assente',  label:'assente'},
    'non dichiarato': {cls:'q-nd',       dot:'qd-nd',       label:'n.d.'}
  };
  const b = badgeMap[lastQ] || badgeMap['non dichiarato'];
  const badge = `<span class="quality-badge ${b.cls}"><span class="quality-dot ${b.dot}"></span>${b.label}</span>`;

  // Inserisci badge accanto alla data
  const hdr = document.querySelector('#block1 .sec-hdr');
  if(hdr){
    const existing = hdr.querySelector('.quality-badge');
    if(existing) existing.remove();
    const dateBox = hdr.querySelector('.date-box');
    if(dateBox) dateBox.insertAdjacentHTML('beforebegin', badge);
  }

  // Stats qualità sopra blocco 1
  const qs = d.qualityStats;
  const statsHtml = `<div class="quality-stats">
    <div class="qs-item">
      <span class="qs-label">Giorni totali</span>
      <span class="qs-val">${qs.total}</span>
    </div>
    <div class="qs-item">
      <span class="qs-label">Completi</span>
      <span class="qs-val" style="color:#3aab7b">${qs.completo}</span>
      <span class="qs-sub">${qs.pct_completo}%</span>
    </div>
    <div class="qs-item">
      <span class="qs-label">Parziali</span>
      <span class="qs-val" style="color:#e09a3a">${qs.parziale}</span>
    </div>
    <div class="qs-item">
      <span class="qs-label">In corso</span>
      <span class="qs-val" style="color:#7aa3d4">${qs.in_corso||0}</span>
    </div>
    <div class="qs-item">
      <span class="qs-label">Assenti</span>
      <span class="qs-val" style="color:#e05c5c">${qs.assente}</span>
    </div>
    <div class="qs-item">
      <span class="qs-label">Medie su</span>
      <span class="qs-val">${d.daysCompletiCount}</span>
      <span class="qs-sub">giorni completi</span>
    </div>
  </div>`;

  const block1 = $('block1');
  const existing = document.querySelector('.quality-stats');
  if(existing) existing.remove();
  block1.insertAdjacentHTML('beforebegin', statsHtml);
}

// ── BLOCCO 1 ──────────────────────────────────────────────────────────────────
function renderBlock1(d){
  const body = $('block1-body');
  let html = '';

  for(const group of d.groupOrder){
    if(group==='hydration') continue; // gestito separatamente
    const nutrients = d.lastDayByGroup[group];
    if(!nutrients||!nutrients.length) continue;

    if(group==='macro'){
      html += renderMacroBlock(nutrients, d.targets);
    } else {
      html += renderNutrientBlock(group, nutrients);
    }
  }

  // Idratazione in fondo
  if(d.waterData){
    html += renderWaterBlock(d.waterData);
  }

  body.innerHTML = html;
}

// Sotto-blocco A — Macro (card)
function renderMacroBlock(nutrients, targets){
  const cards = nutrients.map(n=>{
    const{c,b}=zCls(n.zone);
    const isFiber = n.key==='fiber';
    return`<div class="mbox${isFiber?' mbox-fiber':''}">
      <div class="mbox-label">${n.label} · ${n.unit}</div>
      <div class="mbox-val ${c}">${fmt(n.val)}</div>
      <div class="mbox-bar"><div class="mbox-fill ${b}" style="width:${n.pct?Math.min(n.pct,100):0}%"></div></div>
      <div class="mbox-pct ${c}">${n.pct!==null?n.pct+'%':'—'}</div>
    </div>`;
  }).join('');

  return`<div class="sub-block">
    <div class="sub-title">Macronutrienti</div>
    <div class="macro-grid">${cards}</div>
  </div>`;
}

// Sotto-blocchi B/C/D — tabella nutrienti
function renderNutrientBlock(group, nutrients){
  const groupLabels = {
    bone:'Salute ossea',
    antioxidant:'Antiossidanti & metabolismo',
    'B-group':'Vitamine gruppo B'
  };
  const label = groupLabels[group] || group;

  const rows = nutrients.map(n=>{
    const{c,b}=zCls(n.zone);
    const mmTag = (n.isMovingAvg || n.isOmega3mm4)
      ? '<span class="mm4-tag">mm'+(n.mmWindow || 4)+'</span>'
      : '';
    const nameHtml = `${n.label}`
      + mmTag
      + obsBadge(n.phase);
    const barW = n.pct ? Math.min(n.pct,100) : 0;
    return`<div class="nutr-row">
      <span class="nutr-name">${nameHtml}</span>
      <div class="nutr-bar-wrap"><div class="nutr-bar ${b}" style="width:${barW}%"></div></div>
      <span class="nutr-pct ${c}">${n.pct!==null?n.pct+'%':'—'}</span>
      <span class="nutr-val">${fmt(n.val)} ${n.unit}</span>
    </div>`;
  }).join('');

  return`<div class="sub-block">
    <div class="sub-title">${label}</div>
    <div class="nutr-tbl-hdr">
      <span>nutriente</span><span></span><span>%</span><span>valore</span>
    </div>
    ${rows}
  </div>`;
}

// Idratazione
function renderWaterBlock(w){
  const{c,b}=zCls(w.zone);
  const barW = w.pct ? Math.min(w.pct,100) : 0;
  const mancano = w.target && w.val < w.target
    ? `<span style="font-size:10px;color:#bbb;margin-left:8px">mancano ${Math.round(w.target-w.val)} ${w.unit}</span>`
    : '';
  return`<div class="sub-block">
    <div class="sub-title">Idratazione</div>
    <div style="display:flex;align-items:center;gap:12px;padding:4px 0">
      <span style="font-size:11px;color:#444;min-width:80px">${w.label}</span>
      <div style="flex:1;height:3px;background:#f0f0f0;border-radius:2px;overflow:hidden">
        <div class="${b}" style="height:100%;width:${barW}%;border-radius:2px"></div>
      </div>
      <span class="nutr-pct ${c}" style="min-width:36px;text-align:right">${w.pct!==null?w.pct+'%':'—'}</span>
      <span class="nutr-val" style="min-width:70px;text-align:right">${fmt(w.val)} ${w.unit}</span>
    </div>
    ${mancano?`<div style="padding:2px 0 0 92px">${mancano}</div>`:''}
  </div>`;
}

// ── BLOCCO 2 — Ultimi 7 giorni ───────────────────────────────────────────────
function renderBlock2(d){
  const body = $('block2-body');
  const last7 = d.daily.slice(-7);
  let html = '';

  for(const group of d.groupOrder){
    const members = d.groupMembers[group];
    if(!members||!members.length) continue;

    // Per hydration usiamo waterData
    if(group==='hydration'){
      html += renderCalGroup('Idratazione', ['water'], last7, d, true);
      continue;
    }

    const groupLabels = {
      macro:'Macronutrienti',
      bone:'Salute ossea',
      antioxidant:'Antiossidanti & metabolismo',
      'B-group':'Vitamine gruppo B',
    };
    const label = groupLabels[group] || group;
    html += renderCalGroup(label, members, last7, d, false);
  }

  body.innerHTML = html;
}

function renderCalGroup(title, keys, last7, d, isWater){
  const tgts = d.targets;

  // Header giorni con indicatore qualità
  const qualityMap = {};
  if(d.last7WithQuality){
    d.last7WithQuality.forEach(q => { qualityMap[q.date] = q.log_quality; });
  }
  let thead = `<thead><tr><th class="nc">nutriente</th>`;
  last7.forEach(day => {
    thead += `<th>${fmtShort(day.date)}</th>`;
  });
  thead += `</tr></thead>`;

  let tbody = '<tbody>';
  keys.forEach((k, i) => {
    const tgt = tgts[k];
    if(!tgt && !isWater) return;

    const isOmega = k === 'omega3';
    const cmp     = d.comparison && d.comparison[k];
    const isMM    = cmp ? (cmp.isMovingAvg || cmp.isOmega3mm4) : isOmega;
    const mmWin   = cmp && cmp.mmWindow ? cmp.mmWindow : 4;
    const isObs   = tgt && tgt.phase === 'observation';
    const label   = tgt ? tgt.label : k;

    const nameHtml = label
      + (isMM ? ' <span style="font-size:9px;color:#bbb">mm'+mmWin+'</span>' : '')
      + (isObs   ? ' <span class="obs-badge">OBS</span>' : '');

    tbody += `<tr>`;
    tbody += `<td class="nc">${nameHtml}</td>`;

    last7.forEach(day => {
      let pct, zone;
      if(isWater){
        pct  = day['water_pct'] !== undefined ? day['water_pct'] : null;
        zone = day['water_zone'] || null;
      } else {
        pct  = day[k+'_pct']  !== undefined ? day[k+'_pct']  : null;
        zone = day[k+'_zone'] || null;
      }
      const{b} = zCls(zone);
      const dayQ = qualityMap[day.date] || 'non dichiarato';
      const isPartial = dayQ === 'parziale' || dayQ === 'in corso';
      const isAbsent  = dayQ === 'assente';
      // Per i nutrienti in media mobile (omega3/vitD) il valore resta significativo
      // anche nei giorni assenti, quindi non applichiamo lo stile "assente".
      if(isAbsent && !isMM){
        tbody += `<td><span class="chip-absent">${pct!==null?pct+'%':'0%'}</span></td>`;
      } else {
        const chipCls = isPartial ? `chip-partial ${b}` : `chip ${b}`;
        tbody += `<td><span class="${chipCls}">${pct!==null?pct+'%':'—'}</span></td>`;
      }
    });
    tbody += `</tr>`;
  });
  tbody += '</tbody>';

  return `<div class="sub-block">
    <div class="sub-title">${title}</div>
    <div class="cal-wrap">
      <table class="cal-tbl">
        ${thead}
        ${tbody}
      </table>
    </div>
    <div class="cal-hint">← scorri per vedere tutti i giorni</div>
  </div>`;
}

function fmtShort(s){
  if(!s)return'';
  try{const[,m,dd]=s.split('-');const mo=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];return dd+'<br>'+mo[parseInt(m)-1];}catch(e){return s;}
}

function fmtDate(s){
  if(!s)return'';
  try{const[y,m,dd]=s.split('-');const mo=['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];return dd+' '+mo[parseInt(m)-1]+' '+y;}catch(e){return s;}
}
function fmtT(iso){try{return new Date(iso).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}catch(e){return''}}
function setStatus(ok,msg){$('sdot').className='dot'+(ok?'':' off');$('stxt').textContent=msg;}
</script>
