<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutrition Dashboard — Live</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.08);
    --text: #1a1916;
    --muted: #6b6a65;
    --accent: #1d9e75;
    --accent-light: #e1f5ee;
    --accent-mid: #5dcaa5;
    --warn: #ba7517;
    --warn-light: #faeeda;
    --danger: #a32d2d;
    --danger-light: #fcebeb;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'DM Sans', system-ui, sans-serif; color: var(--text); min-height: 100vh; }

  /* Google Font */
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400&display=swap');

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
  header .meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 12px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .dot.offline { background: var(--warn); }

  main { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }

  /* URL setup */
  #setup {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    text-align: center;
    margin-bottom: 2rem;
  }
  #setup h2 { font-size: 18px; font-weight: 500; margin-bottom: 0.5rem; }
  #setup p { color: var(--muted); font-size: 14px; margin-bottom: 1.5rem; line-height: 1.6; }
  #setup .input-row { display: flex; gap: 8px; max-width: 560px; margin: 0 auto; }
  #setup input {
    flex: 1; padding: 10px 14px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-size: 14px; background: var(--bg);
    color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px;
  }
  #setup input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  #setup button {
    padding: 10px 20px; background: var(--accent); color: white; border: none;
    border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer;
    white-space: nowrap;
  }
  #setup button:hover { background: #0f6e56; }

  /* Loading */
  #loading {
    display: none; text-align: center; padding: 4rem;
    color: var(--muted); font-size: 14px;
  }
  .spinner {
    width: 28px; height: 28px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite; margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error */
  #error {
    display: none; background: var(--danger-light); border: 1px solid rgba(163,45,45,0.2);
    border-radius: var(--radius); padding: 1.25rem 1.5rem; margin-bottom: 1.5rem;
    color: var(--danger); font-size: 14px; line-height: 1.6;
  }

  /* Dashboard */
  #dashboard { display: none; }

  /* KPI cards */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 1.5rem;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
  }
  .kpi .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .kpi .value { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; }
  .kpi .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .kpi.accent { border-left: 3px solid var(--accent); }
  .kpi.warn { border-left: 3px solid var(--warn); }

  /* Progress bars */
  .prog-bar { height: 4px; background: var(--bg); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.6s ease; }
  .prog-fill.over { background: var(--warn); }
  .prog-fill.low { background: var(--danger); }

  /* Section */
  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  section h2 { font-size: 14px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 1.25rem; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 1.25rem; }
  .tab {
    padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px;
    font-size: 13px; cursor: pointer; color: var(--muted); background: transparent;
    transition: all 0.15s;
  }
  .tab.active { background: var(--accent); color: white; border-color: var(--accent); }

  /* Micro charts */
  .chart-wrap { position: relative; width: 100%; }

  /* Meal grid */
  .meal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .meal-card {
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1rem;
  }
  .meal-card .name { font-size: 13px; font-weight: 500; margin-bottom: 8px; }
  .meal-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 2px 0; }
  .meal-row span:last-child { color: var(--text); font-weight: 500; }

  /* Nutrients table */
  .nutr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .nutr-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .nutr-label { color: var(--muted); min-width: 100px; }
  .nutr-bar-wrap { flex: 1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .nutr-bar { height: 100%; border-radius: 3px; background: var(--accent-mid); }
  .nutr-bar.low-fill { background: var(--danger); }
  .nutr-val { font-weight: 500; min-width: 60px; text-align: right; font-size: 12px; }

  /* Top foods */
  .food-row {
    display: flex; align-items: center; gap: 10px; padding: 7px 0;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .food-row:last-child { border-bottom: none; }
  .food-rank { width: 20px; text-align: center; font-size: 11px; color: var(--muted); }
  .food-name { flex: 1; }
  .food-kcal { font-weight: 500; color: var(--muted); font-size: 12px; }

  /* Footer */
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 2rem; }

  /* Refresh btn */
  .refresh-btn {
    padding: 7px 14px; border: 1px solid var(--border); background: var(--surface);
    border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; color: var(--muted);
  }
  .refresh-btn:hover { background: var(--bg); }

  @media (max-width: 600px) {
    main { padding: 1rem; }
    header { padding: 0.75rem 1rem; }
    .nutr-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>Diario Nutrizionale</h1>
  <div class="meta">
    <span class="dot" id="status-dot"></span>
    <span id="status-text">non connesso</span>
    <button class="refresh-btn" onclick="loadData()" id="refresh-btn" style="display:none">↻ Aggiorna</button>
  </div>
</header>

<main>

  <!-- Setup -->
  <div id="setup">
    <h2>Connetti al tuo Google Sheet</h2>
    <p>Incolla qui l'URL del tuo Apps Script (Web App URL)<br>ottenuto dopo aver pubblicato lo script.</p>
    <div class="input-row">
      <input type="text" id="api-url" placeholder="https://script.google.com/macros/s/..." />
      <button onclick="connect()">Connetti</button>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    Caricamento dati dal Google Sheet…
  </div>

  <!-- Error -->
  <div id="error"></div>

  <!-- Dashboard -->
  <div id="dashboard">

    <!-- KPI medie -->
    <div class="kpi-grid" id="kpi-grid"></div>

    <!-- Calorie nel tempo -->
    <section>
      <h2>Andamento giornaliero</h2>
      <div class="tabs" id="trend-tabs"></div>
      <div class="chart-wrap" style="height:220px"><canvas id="trendChart" role="img" aria-label="Andamento giornaliero dei nutrienti"></canvas></div>
    </section>

    <!-- Per pasto + Micro -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1.5rem">

      <section style="margin-bottom:0">
        <h2>Per pasto (medie)</h2>
        <div id="meal-cards"></div>
      </section>

      <section style="margin-bottom:0">
        <h2>Micronutrienti (media/g)</h2>
        <div class="nutr-grid" id="nutr-grid"></div>
      </section>

    </div>

    <!-- Top alimenti -->
    <section>
      <h2>Top alimenti per calorie totali</h2>
      <div id="top-foods"></div>
    </section>

  </div>
</main>

<footer id="footer"></footer>

<script>
const RDA = {
  kcal: 2000, prot: 55, carb: 260, fat: 70,
  omega3: 1.6, fiber: 25, calcium: 1000,
  vitC: 80, selenium: 55, iron: 10,
  vitK2: 75, magnesium: 375, vitD: 15
};
const LABELS = {
  kcal:'Calorie', prot:'Proteine', carb:'Carboidrati', fat:'Grassi',
  omega3:'Omega 3', fiber:'Fibre', calcium:'Calcio',
  vitC:'Vit. C', selenium:'Selenio', iron:'Ferro',
  vitK2:'Vit. K2', magnesium:'Magnesio', vitD:'Vit. D'
};
const UNITS = {
  kcal:'kcal', prot:'g', carb:'g', fat:'g',
  omega3:'g', fiber:'g', calcium:'mg',
  vitC:'mg', selenium:'µg', iron:'mg',
  vitK2:'µg', magnesium:'mg', vitD:'µg'
};

let trendChart = null;
let currentMetric = 'kcal';
let cachedData = null;

function getSavedUrl() { try { return localStorage.getItem('nutrition_api_url') || ''; } catch(e){ return ''; } }
function saveUrl(u) { try { localStorage.setItem('nutrition_api_url', u); } catch(e){} }

window.onload = () => {
  const saved = getSavedUrl();
  if (saved) { document.getElementById('api-url').value = saved; connect(); }
};

async function connect() {
  const url = document.getElementById('api-url').value.trim();
  if (!url) { showError('Inserisci l\'URL prima di connetterti.'); return; }
  saveUrl(url);
  await loadData();
}

async function loadData() {
  const url = getSavedUrl();
  if (!url) return;

  hide('setup'); hide('dashboard'); hide('error');
  show('loading');

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    cachedData = data;
    renderDashboard(data);
    setStatus(true, 'aggiornato ' + fmtTime(data.generated));
    document.getElementById('refresh-btn').style.display = 'inline-block';
  } catch(e) {
    showError('Impossibile caricare i dati.<br><strong>Causa:</strong> ' + e.message + '<br><br>Verifica che l\'URL sia corretto e che lo script sia pubblicato come "Chiunque".');
    setStatus(false, 'errore connessione');
    show('setup');
  } finally {
    hide('loading');
  }
}

function renderDashboard(d) {
  renderKPIs(d);
  renderTrendChart(d, 'kcal');
  renderMeals(d);
  renderMicros(d);
  renderTopFoods(d);
  document.getElementById('footer').textContent =
    d.nDays + ' giorni registrati · ultimo: ' + (d.lastEntry || '—');
  show('dashboard');
}

function renderKPIs(d) {
  const keys = ['kcal','prot','carb','fat','fiber'];
  const labels = { kcal:'Calorie /g', prot:'Proteine /g', carb:'Carboidrati /g', fat:'Grassi /g', fiber:'Fibre /g' };
  const grid = document.getElementById('kpi-grid');
  grid.innerHTML = keys.map(k => {
    const v = d.avg[k] || 0;
    const rda = RDA[k];
    const pct = rda ? Math.min(Math.round(v/rda*100), 150) : null;
    const cls = pct ? (pct > 110 ? 'over' : pct < 60 ? 'low' : '') : '';
    const borderCls = pct ? (pct > 110 ? 'warn' : pct < 60 ? '' : 'accent') : '';
    return `<div class="kpi ${borderCls}">
      <div class="label">${labels[k]}</div>
      <div class="value">${fmt(v)}</div>
      <div class="sub">${UNITS[k]}${rda ? ' · ' + pct + '% RDA' : ''}</div>
      ${rda ? `<div class="prog-bar"><div class="prog-fill ${cls}" style="width:${Math.min(pct,100)}%"></div></div>` : ''}
    </div>`;
  }).join('');
}

function renderTrendChart(d, metric) {
  currentMetric = metric;
  const tabs = ['kcal','prot','carb','fat'];
  document.getElementById('trend-tabs').innerHTML = tabs.map(k =>
    `<button class="tab ${k===metric?'active':''}" onclick="renderTrendChart(cachedData,'${k}')">${LABELS[k]}</button>`
  ).join('');

  const daily = d.daily.slice(-30);
  const labels = daily.map(r => r.date.slice(5)); // MM-DD
  const values = daily.map(r => Math.round(r[metric]*10)/10);
  const rdaLine = RDA[metric] ? daily.map(() => RDA[metric]) : null;

  if (trendChart) { trendChart.destroy(); }

  const ctx = document.getElementById('trendChart').getContext('2d');
  trendChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: LABELS[metric],
          data: values,
          borderColor: '#1d9e75',
          backgroundColor: 'rgba(29,158,117,0.08)',
          fill: true,
          tension: 0.35,
          pointRadius: 2,
          borderWidth: 2,
        },
        ...(rdaLine ? [{
          label: 'RDA',
          data: rdaLine,
          borderColor: 'rgba(186,117,23,0.5)',
          borderDash: [4,4],
          borderWidth: 1.5,
          pointRadius: 0,
          fill: false,
        }] : [])
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { maxTicksLimit: 10, font: { size: 11 }, color: '#6b6a65' } },
        y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { font: { size: 11 }, color: '#6b6a65' } }
      }
    }
  });
}

function renderMeals(d) {
  const mealOrder = ['Colazione','Pranzo','Cena','Spuntino'];
  const meals = d.byMeal.sort((a,b) => {
    const ia = mealOrder.indexOf(a.meal), ib = mealOrder.indexOf(b.meal);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  const nDays = d.nDays || 1;
  document.getElementById('meal-cards').innerHTML = meals.map(m => `
    <div class="meal-card">
      <div class="name">${m.meal}</div>
      ${['kcal','prot','carb','fat'].map(k =>
        `<div class="meal-row"><span>${LABELS[k]}</span><span>${fmt(m[k]/nDays)} ${UNITS[k]}</span></div>`
      ).join('')}
    </div>
  `).join('');
}

function renderMicros(d) {
  const keys = ['calcium','vitC','selenium','iron','magnesium','vitD','omega3'];
  document.getElementById('nutr-grid').innerHTML = keys.map(k => {
    const v = d.avg[k] || 0;
    const rda = RDA[k];
    const pct = rda ? Math.min(v/rda*100, 100) : 50;
    const low = rda && v < rda*0.5;
    return `<div class="nutr-row">
      <span class="nutr-label">${LABELS[k]}</span>
      <div class="nutr-bar-wrap"><div class="nutr-bar ${low?'low-fill':''}" style="width:${pct}%"></div></div>
      <span class="nutr-val">${fmt(v)} ${UNITS[k]}</span>
    </div>`;
  }).join('');
}

function renderTopFoods(d) {
  document.getElementById('top-foods').innerHTML = d.topFood.slice(0,10).map((f,i) =>
    `<div class="food-row">
      <span class="food-rank">${i+1}</span>
      <span class="food-name">${f.name}</span>
      <span class="food-kcal">${f.kcal} kcal</span>
    </div>`
  ).join('');
}

// ─── Utils ───────────────────────────────────────────────────────────────────
function fmt(v) { return Math.round(v*10)/10; }
function fmtTime(iso) {
  try { return new Date(iso).toLocaleTimeString('it-IT', {hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return ''; }
}
function show(id) { document.getElementById(id).style.display = ''; }
function hide(id) { document.getElementById(id).style.display = 'none'; }
function showError(msg) {
  const el = document.getElementById('error');
  el.innerHTML = msg; el.style.display = 'block';
}
function setStatus(online, msg) {
  document.getElementById('status-dot').className = 'dot' + (online ? '' : ' offline');
  document.getElementById('status-text').textContent = msg;
}
</script>
</body>
</html>
